name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v6.4.0, not v7.0.0: GitHub's archive server answers 404 for v7.0.0's
      # commit, so runners without a cached copy fail at set-up. v7 changed
      # only the action's own packaging and dependencies.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Format check, lint, race tests and the cross-compiles, through the
      # same target contributors run. -race needs cgo, so keep CGO_ENABLED=0
      # out of this step's environment; with CI set, make fails rather than
      # dropping -race.
      - name: make ci
        run: make ci

      # setup-go exports GOTOOLCHAIN=local. The install opts back into
      # toolchain switching, so a govulncheck that needs a newer Go than
      # go.mod still builds. The scan itself must run under the job's
      # toolchain: `go run` would check the newer toolchain's standard
      # library instead of the one ficha is built with.
      - name: govulncheck
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v6.4.0, not v7.0.0: GitHub's archive server answers 404 for v7.0.0's
      # commit, so runners without a cached copy fail at set-up. v7 changed
      # only the action's own packaging and dependencies.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
