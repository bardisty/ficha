name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The binary's version is injected from the VERSION file via ldflags, so a
      # tag that disagrees with VERSION would ship a binary that misreports its
      # own version. Fail fast instead.
      - name: Verify tag matches VERSION
        run: |
          want="v$(cat VERSION)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file ($want)"
            exit 1
          fi

      - name: Build all platforms
        run: make build-all

      - name: Generate checksums
        run: cd bin && sha256sum ccusage-* > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" bin/ccusage-* bin/checksums.txt --generate-notes
