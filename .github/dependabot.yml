version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # The terminal libraries set go.mod's go line, and one that asks for
      # a Go the linter can't load fails lint. In a group of their own,
      # that holds up only their PR.
      terminal-ui:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
          - "github.com/NimbleMarkets/ntcharts*"
      go-modules:
        patterns: ["*"]

  # Workflows pin actions by commit SHA; Dependabot bumps the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
