name: Bug report
description: Something ficha does wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ficha version
      description: Output of `ficha version`.
      placeholder: ficha 0.55.0 (01ff73c, go1.25.14, linux/amd64)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS
      description: The release, like "macOS 15" or "Ubuntu 24.04". `ficha version` already gives the architecture.
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`. The transcript format changes between releases, so this matters.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: ficha summary -d -f csv
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with -v
      description: Rerun the command with `-v` and paste everything it prints, warnings included. Transcripts contain your prompts and code, and ficha's output can include file paths, so redact anything you don't want public.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I have removed prompts, code, and personal paths from anything pasted above.
          required: true
